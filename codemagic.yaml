workflows:
  unity-ios-build:
    name: Build iOS para Teste
    instance_type: mac_mini_m2
    environment:
      vars:
        UNITY_BIN: /Applications/Unity/Hub/Editor/2022.3.20f1/Unity.app/Contents/MacOS/Unity
    scripts:
      - name: Build do Unity para iOS
        script: |
          $UNITY_BIN -batchmode -quit -projectPath . -executeMethod BuildScript.BuildIOS -nographics
      - name: Gerar arquivo IPA
        script: |
          cd ios_build
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos build
          mkdir -p Payload
          cp -r build/Release-iphoneos/Unity-iPhone.app Payload/
          zip -r Catverse_Journey.ipa Payload
    artifacts:
      - "*.ipa"