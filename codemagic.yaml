workflows:
unity_ios_build:
name: Build iOS
instance_type: mac_mini_m2

environment:
  unity: 2022.3.62f2
  groups:
    - Jana

scripts:
  - name: Activate Unity License
    script:
      - echo "$UNITY_LICENSE" > unity.ulf
      - $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -manualLicenseFile unity.ulf

  - name: Build Unity iOS
    script:
      - $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -projectPath . -executeMethod BuildScript.BuildIOS -nographics

  - name: Create IPA
    script:
      - cd ios_build
      - xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO
      - mkdir -p Payload
      - cp -r build/Release-iphoneos/Unity-iPhone.app Payload/
      - zip -r app.ipa Payload

artifacts:
  - app.ipa