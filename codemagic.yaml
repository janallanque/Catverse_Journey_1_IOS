workflows:
  unity-ios-build:
    name: Build iOS para Teste
    instance_type: mac_mini_m2
    
    environment:
      unity: 2022.3.62f2
    
    scripts:
      - name: Build do Unity para iOS
        script: |
          $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit \
            -projectPath . \
            -executeMethod BuildScript.BuildIOS \
            -nographics \
            -logFile - \
            -username "$UNITY_EMAIL" \
            -password "$UNITY_PASSWORD" \
            -serial "$UNITY_SERIAL"
      
      - name: Gerar arquivo IPA
        script: |
          cd ios_build
          
          # Criar arquivo de opções de exportação
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>teamID</key>
              <string>YOUR_TEAM_ID</string>
          </dict>
          </plist>
          EOF
          
          # Build do Xcode
          xcodebuild clean archive \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -archivePath ./build/Unity-iPhone.xcarchive \
            CODE_SIGNING_ALLOWED=NO
          
          # Exportar IPA
          xcodebuild -exportArchive \
            -archivePath ./build/Unity-iPhone.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist exportOptions.plist
          
          # Mover IPA para a raiz
          if [ -f "./build/Unity-iPhone.ipa" ]; then
            cp ./build/Unity-iPhone.ipa ./Catverse_Journey.ipa
          fi
    
    artifacts:
      - "*.ipa"