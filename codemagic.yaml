workflows:
  unity-ios-build:
    name: Build iOS para Teste
    instance_type: mac_mini_m2
    
    environment:
      unity: 2022.3.62f2
         groups:
            - Jana

    scripts:
      - name: Ativar licença do Unity
        script: |
          echo "$UNITY_LICENSE" | base64 --decode > unity.ulf
          $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit -nographics -logFile - -manualLicenseFile unity.ulf

      - name: Build do Unity para iOS
        script: |
          $UNITY_HOME/Contents/MacOS/Unity -batchmode -quit \
            -projectPath . \
            -executeMethod BuildScript.BuildIOS \
            -nographics \
            -logFile -

      - name: Gerar arquivo IPA
        script: |
          cd ios_build

          xcodebuild -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/Release-iphoneos/Unity-iPhone.app Payload/
          zip -r Catverse_Journey.ipa Payload

    artifacts:
      - "*.ipa"